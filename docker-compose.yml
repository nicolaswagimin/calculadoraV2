services:
  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
    ports:
      - "127.0.0.1:4566:4566"
    healthcheck:
      test: ["CMD", "awslocal", "s3api", "list-buckets"]
      interval: 3s
      timeout: 5s
      retries: 30
  api:
    build: .
    image: calculadora-notas:local
    command: ["sh", "-ec", "python -m infra.setup_aws && exec python -m flask --app app.main run --host=0.0.0.0 --port=5000"]
    environment: &aws
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/salud', timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 30
  test-runner:
    image: calculadora-notas:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *aws
      API_URL: http://api:5000
    command: ["pytest", "tests/api", "-p", "no:cacheprovider", "--no-cov"]
