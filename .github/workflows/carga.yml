name: Pruebas de carga
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  carga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --only-binary :all: --require-hashes -r requirements.lock
      - run: docker compose up -d --build --wait --wait-timeout 120 api
      - run: >-
          locust -f load/locustfile.py --host http://localhost:5000
          --headless -u 100 -r 10 -t 1m --exit-code-on-error 0
          --html reporte-carga.html --csv resultados
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-carga
          path: |
            reporte-carga.html
            resultados*.csv
      - if: always()
        run: docker compose down -v
